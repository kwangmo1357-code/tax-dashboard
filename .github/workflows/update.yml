name: 대시보드 데이터 갱신 및 배포

on:
  schedule:
    - cron: "47 21 * * *"     # 매일 06:47 KST (UTC 21:47)
  workflow_dispatch:           # Actions 탭에서 수동 실행 버튼
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", ".github/workflows/**"]

permissions:
  contents: write    # data/summaries.json 캐시 커밋
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 법제처 조회 + Claude 요약
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: python scripts/update_data.py

      - name: 요약 캐시 커밋 (같은 건을 다시 요약하지 않도록)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/summaries.json
          git diff --cached --quiet || git commit -m "chore: 요약 캐시 갱신 $(TZ=Asia/Seoul date +%F)"
          git push || echo "push 생략"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
